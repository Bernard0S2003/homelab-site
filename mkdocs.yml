site_name: Bernardo's Homelab
site_description: Documentation and technical showcase of my homelab environment.
site_author: Bernardo Silva

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light theme
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark theme
  features:
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

docs_dir: docs

nav:
  - Home: index.md
  - Infrastructure: infraestrutura.md
  - Services: servicos.md
  - Projects: projetos.md
  - About: sobre.md
